[package]
name = "bridge-protocol"
version = "0.1.0"
edition = "2021"
description = "Shared protocol and cryptographic primitives for Android Desktop Bridge"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
thiserror = "1.0"
