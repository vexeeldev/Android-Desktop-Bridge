[package]
name = "bridge-relay"
version = "0.1.0"
edition = "2021"
description = "Async WebSocket relay and signaling server for Android Desktop Bridge"

[dependencies]
bridge-protocol = { path = "../protocol" }
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.8", features = ["v4"] }
